# 1) Roda os testes no Linux e no Windows a cada envio de código.
# 2) Se passarem, gera o instalador, instala, testa o .exe e desinstala.
#    (na main, em tags v* ou clicando em "Run workflow")
name: Testes e instalador

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest

  instalador:
    name: Instalador Windows
    needs: testes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: cmd
        run: CRIAR_INSTALADOR.bat

      - name: Instalar, testar o .exe e desinstalar
        shell: pwsh
        run: |
          $instalador = Get-ChildItem saida\*.exe | Select-Object -First 1
          if (-not $instalador) { throw "Instalador não foi gerado" }
          Write-Host "Instalador: $($instalador.Name) ($([math]::Round($instalador.Length/1MB)) MB)"

          # instalação silenciosa, como um usuário comum (sem administrador)
          $p = Start-Process $instalador.FullName -Wait -PassThru `
               -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER'
          if ($p.ExitCode -ne 0) { throw "Instalação falhou (código $($p.ExitCode))" }

          $pasta = "$env:LOCALAPPDATA\Programs\PendrivePlay"
          $exe = "$pasta\PendrivePlay.exe"
          if (-not (Test-Path $exe)) { throw "PendrivePlay.exe não foi instalado em $pasta" }
          if (-not (Test-Path "$pasta\ffmpeg.exe")) { throw "ffmpeg.exe não foi instalado" }
          Write-Host "Instalado em $pasta"

          # roda o autoteste do programa instalado
          $resultado = "$env:RUNNER_TEMP\autoteste.txt"
          $t = Start-Process $exe -Wait -PassThru -ArgumentList '--autoteste', "`"$resultado`""
          Get-Content $resultado -Encoding utf8
          if ($t.ExitCode -ne 0) { throw "Autoteste do .exe falhou" }

          # desinstala e confere se saiu
          $d = Start-Process "$pasta\unins000.exe" -Wait -PassThru `
               -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Desinstalação não removeu o programa" }
          Write-Host "Desinstalação OK"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v5
        with:
          name: PendrivePlay-Instalador
          path: saida/*.exe

      - name: Montar o pacote do Gumroad (.zip)
        shell: pwsh
        run: |
          $instalador = Get-ChildItem saida\*.exe | Select-Object -First 1
          $versao = $instalador.BaseName -replace '^PendrivePlay_Instalador_', ''
          $pasta = "pacote\PendrivePlay_$versao"
          New-Item -ItemType Directory -Force "$pasta\licencas" | Out-Null
          Copy-Item $instalador.FullName $pasta
          Copy-Item docs\gumroad\GUIA_DE_INSTALACAO.pdf $pasta
          Copy-Item instalador\LEIA_ANTES_DE_INSTALAR.txt $pasta
          Copy-Item licencas\* "$pasta\licencas"
          Copy-Item LICENSE "$pasta\licencas\PendrivePlay-LICENSE.txt"
          New-Item -ItemType Directory -Force saida_gumroad | Out-Null
          Compress-Archive -Path $pasta -DestinationPath "saida_gumroad\PendrivePlay_$versao.zip" -Force
          Write-Host "Conteúdo do pacote:"
          Get-ChildItem -Recurse $pasta | ForEach-Object {
            "{0,10:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Replace("$PWD\pacote\", "")
          }
          $zip = Get-Item "saida_gumroad\PendrivePlay_$versao.zip"
          Write-Host "Pacote: $($zip.Name) ($([math]::Round($zip.Length/1MB)) MB)"

      - name: Guardar o pacote do Gumroad
        uses: actions/upload-artifact@v5
        with:
          name: PendrivePlay-Gumroad
          path: saida_gumroad/*.zip

      - name: Baixar o código-fonte do FFmpeg (exigência da GPL, só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $linha = (& dist\PendrivePlay\ffmpeg.exe -version | Select-Object -First 1)
          if ($linha -notmatch 'ffmpeg version (\d+(\.\d+)+)') { throw "Versão do ffmpeg não reconhecida: $linha" }
          $v = $Matches[1]
          New-Item -ItemType Directory -Force fonte_ffmpeg | Out-Null
          Invoke-WebRequest "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz" -OutFile "fonte_ffmpeg\ffmpeg-$v-codigo-fonte.tar.xz"
          Get-ChildItem fonte_ffmpeg

      - name: Publicar na página de Releases (só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            saida/*.exe
            fonte_ffmpeg/*
